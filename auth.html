
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BookNest</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header>
        <h1>BookNest</h1>
        <p>Books, ideas, and imagination.</p>
    </header>

    <main>
        <h2>Welcome to BookNest</h2>
        <p>Your personal reading space.</p>

        
<section class="auth-container">

    <div class="auth-tabs">
        <button id="login-tab" class="active">Login</button>
        <button id="register-tab">Register</button>
    </div>

    <form id="login-form">
        <h3>Welcome Back</h3>

        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Enter your email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>

    <form id="register-form" hidden>
        <h3>Create Your Account</h3>

        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" placeholder="Enter your name" required>

        <label for="register-email">Email</label>
        <input type="email" id="register-email" placeholder="Enter your email" required>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" placeholder="Create a password" required>

        <button type="submit">Register</button>
    </form>

</section>

    </main>
<script src="auth.js"></script>
</body>
</html>
